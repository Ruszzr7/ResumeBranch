server {
    listen 80;
    server_name _ offerflow.one www.offerflow.one;

    root /usr/share/nginx/html;
    index index.html;

    # MIME types for JavaScript modules
    types {
        text/html html htm shtml;
        text/css css;
        text/xml xml;
        application/javascript js mjs;
        application/json json;
        application/xml xml;
        image/svg+xml svg;
        font/ttf ttf;
        font/otf otf;
        font/eot eot;
        font/woff woff;
        font/woff2 woff2;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 请求体大小限制
    client_max_body_size 10m;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router History 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理 - 所有后端 API 路径
    location ~ ^/(auth|health|load_resume|save_resume|load_jd|save_jd|load_conversation|save_conversation|chat|parse_jd|export_pdf|confirm|api) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 备用：/api/ 路径代理
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
