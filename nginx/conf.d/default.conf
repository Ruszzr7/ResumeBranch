server {
    listen 80;
    server_name _ offerflow.one www.offerflow.one;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fixed backend endpoints. Keeping these exact prevents Vue page routes from
    # accidentally being forwarded to FastAPI during a browser refresh.
    location ~ ^/(app/config|settings/llm(?:/test)?|auth(?:/.*)?|health|resume-sources|load_resume|save_resume|load_jd|save_jd|load_conversation|save_conversation|chat|parse_jd|export_pdf|export_docx|confirm|api(?:/.*)?)$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Project APIs stop before the task workspace page path
    # /projects/:projectId/tasks/:taskId, which must be handled by Vue Router.
    location = /projects { proxy_pass http://backend:8000; }
    location ~ ^/projects/[^/]+$ { proxy_pass http://backend:8000; }
    location ~ ^/projects/[^/]+/tasks$ { proxy_pass http://backend:8000; }
    location ~ ^/tasks/[^/]+(?:/undo)?$ { proxy_pass http://backend:8000; }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Vue Router history mode: every non-file, non-API page receives index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
