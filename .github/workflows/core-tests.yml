name: Core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_MODE: local
      DATABASE_URL: "sqlite:///:memory:"
      LLM_API_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install locked backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.lock.txt

      - name: Run backend tests
        run: python -m unittest discover -s tests -p "test_*.py"

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
